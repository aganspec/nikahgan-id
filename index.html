<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikahgan.id - Platform Undangan Digital Premium</title>
    <style>
        body { font-family: sans-serif; background-color: #f8fafc; color: #334155; margin: 0; padding: 20px; }
        .container { max-w: 400px; margin: 40px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; }
        h2 { text-align: center; color: #0f172a; margin-bottom: 5px; }
        p { text-align: center; font-size: 14px; color: #64748b; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #475569; text-transform: uppercase; }
        input { w-index: 100%; width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; background-color: #f8fafc; font-size: 14px; }
        input:focus { outline: none; border-color: #e11d48; background-color: white; }
        button { width: 100%; background-color: #e11d48; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #be123c; }
        button:disabled { background-color: #fda4af; cursor: not-allowed; }
        #error-message { color: #b91c1c; background-color: #fef2f2; padding: 10px; border-radius: 8px; font-size: 14px; text-align: center; margin-bottom: 15px; border: 1px solid #fee2e2; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Daftar Akun Pengantin</h2>
        <p>Mulai langkah awal untuk membuat undangan digital Anda</p>

        <form id="formRegister">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" required placeholder="Contoh: Tes Admin">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="contoh@nikahgan.id">
            </div>

            <div class="form-group">
                <label for="whatsapp">Nomor WhatsApp</label>
                <input type="tel" id="whatsapp" required placeholder="Contoh: 085711167888">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••">
            </div>

            <div id="error-message" class="hidden"></div>

            <button type="submit" id="btnSubmit">Buat Akun Sekarang</button>
        </form>
    </div>

    <!-- Menghubungkan ke file logika eksternal secara aman -->
    <script src="/script.js"></script>
</body>
</html>
