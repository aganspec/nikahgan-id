<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nikahgan.id - FIX</title>
<style>body{background:#FFFBF5;padding:20px;font-family:sans-serif}.box{max-width:400px;margin:20px auto;background:#fff;padding:24px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.08)}input{width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1.5px solid #ddd}label{font-size:10px;font-weight:700}.btn{width:100%;padding:14px;background:#E11D48;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:15px}</style></head><body>
<div class="box" id="a"><h1 style="text-align:center">NIKAH<span style="color:#C5A572">GAN</span>.ID</h1><p style="text-align:center;font-size:11px;color:#999">PLATFORM UNDANGAN - FIX FINAL</p>
<label>NAMA</label><input id="nama" value="Tes Admin"><label>EMAIL</label><input id="email" value="adhedheabi93@gmail.com"><label>WA</label><input id="wa" value="085711167888"><label>PASS</label><input id="pass" type="password" value="123456">
<button class="btn" onclick="buatAkun()">Buat Akun Sekarang - KLIK</button></div>
<div class="box" id="b" style="display:none;text-align:center"><h2 style="color:green">✅ BERHASIL!</h2><p id="o"></p><button class="btn" style="background:#111;margin-top:12px" onclick="location.href='dashboard.html'">Masuk Dashboard</button></div>
<script>
function buatAkun(){
 var n=document.getElementById('nama').value.trim();
 var e=document.getElementById('email').value.trim();
 var w=document.getElementById('wa').value.trim();
 var p=document.getElementById('pass').value.trim();
 if(!n||!e||!w||!p){alert('Isi semua bos!');return;}
 localStorage.setItem('nikahgan_user',JSON.stringify({nama:n,email:e,wa:w}));
 document.getElementById('a').style.display='none';
 document.getElementById('b').style.display='block';
 document.getElementById('o').innerText='Halo '+n+'\n'+e+'\n'+w;
 alert('SUKSES BOS! Akun '+n+' aktif!');
}
</script></body></html>
