<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>nikahgan.id</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Playfair+Display:wght@700&display=swap');
*{box-sizing:border-box;font-family:Poppins}body{background:#FFFBF5;margin:0;padding:20px}
.box{max-width:460px;margin:20px auto;background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.08)}
h1{font-family:'Playfair Display';font-size:26px;text-align:center}h1 span{color:#C5A572}
label{font-size:10px;font-weight:700;color:#475569;display:block;margin-top:10px}
input{width:100%;padding:12px;border-radius:12px;border:1.5px solid #E2E8F0;margin:5px 0 10px}
.btn{width:100%;padding:14px;background:#E11D48;color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer}
#sukses{display:none;text-align:center}
</style>
</head>
<body>
<div class="box" id="formBox">
<h1>NIKAH<span>GAN</span>.ID</h1>
<p style="text-align:center;font-size:11px;color:#999">✨ PLATFORM UNDANGAN MASA KINI</p>
<h2 style="text-align:center;margin:14px 0 4px">Daftar Akun Pengantin</h2>
<label>NAMA LENGKAP</label><input id="nama" value="Tes Admin">
<label>EMAIL</label><input id="email" value="adhedheabi93@gmail.com">
<label>NO WA</label><input id="wa" value="085711167888">
<label>PASSWORD</label><input id="pass" type="password" value="123456">
<button class="btn" id="btnDaftar" type="button">Buat Akun Sekarang</button>
</div>
<div class="box" id="sukses">
<h2 style="color:#10B981">✅ AKUN BERHASIL!</h2>
<p id="welcome"></p>
<button class="btn" style="background:#111" onclick="location.href='/'">Masuk Dashboard</button>
</div>
<script>
document.getElementById('btnDaftar').addEventListener('click', function(){
 const n=document.getElementById('nama').value.trim();
 const e=document.getElementById('email').value.trim();
 const w=document.getElementById('wa').value.trim();
 const p=document.getElementById('pass').value.trim();
 if(!n||!e||!w||!p){alert('Lengkapi dulu bos!');return;}
 localStorage.setItem('nikahgan_user', JSON.stringify({nama:n,email:e,wa:w,login:true}));
 this.innerText='⏳ Membuat...'; this.disabled=true;
 setTimeout(()=>{
  document.getElementById('formBox').style.display='none';
  document.getElementById('sukses').style.display='block';
  document.getElementById('welcome').innerText='Halo '+n+' - '+e+' - '+w;
 },700);
});
</script>
</body>
</html>
