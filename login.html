<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - nikahgan.id</title>
<style>body{background:#FFFBF5;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif}.box{background:#fff;padding:24px;border-radius:20px;max-width:360px;width:90%;box-shadow:0 10px 30px rgba(0,0,0,.07)}input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1.5px solid #ddd}.btn{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:10px;font-weight:700}</style></head><body>
<div class="box"><h2 style="text-align:center">Login Pengantin</h2>
<input id="e" placeholder="Email"><input id="p" type="password" placeholder="Password">
<button class="btn" onclick="login()">Masuk</button>
<p style="text-align:center;font-size:12px;margin-top:12px"><a href="/">Belum punya akun? Daftar</a></p></div>
<script>function login(){var u=localStorage.getItem('nikahgan_user');if(!u){alert('Belum daftar bos! Daftar dulu di halaman utama');location.href='/';return;}alert('Login sukses!');location.href='dashboard.html';}</script>
</body></html>
