<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = 'https://xxx.supabase.co' // ganti punya lu
const supabaseKey = 'eyJxxx...' // ganti anon key punya lu
const supabase = supabaseJs.createClient(supabaseUrl, supabaseKey)

document.getElementById('daftarForm').addEventListener('submit', async function(e){
 e.preventDefault()
 const nama = document.getElementById('nama').value
 const email = document.getElementById('email').value
 const wa = document.getElementById('wa').value
 const pass = document.getElementById('pass').value

 // 1. Daftar ke Supabase Auth
 const { data, error } = await supabase.auth.signUp({
   email: email,
   password: pass,
   options: { data: { nama: nama, wa: wa } }
 })

 if(error){
   alert('Gagal: ' + error.message)
   return
 }

 // 2. Simpen tambahan ke table profiles
 await supabase.from('profiles').insert([{ email: email, nama: nama, wa: wa }])

 // 3. Sukses
 document.getElementById('daftarForm').classList.add('hidden')
 document.getElementById('sNama').innerText = nama
 document.getElementById('sukses').classList.remove('hidden')

 setTimeout(()=>{
   window.location.href = '/login.html' // atau /pricing.html
 }, 1500)
})
</script>
