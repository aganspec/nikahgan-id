<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Nikahgan.id</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://jsdelivr.net"></script>
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between antialiased">

    <!-- NAVIGATION BAR -->
    <nav class="bg-white border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center">
            <a href="index.html" class="text-2xl font-black text-rose-600 tracking-tight">nikahgan<span class="text-slate-400">.id</span></a>
        </div>
    </nav>

    <!-- LOGIN FORM -->
    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full bg-white p-8 rounded-3xl border border-slate-200 shadow-xl shadow-slate-100/70">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-serif font-bold text-slate-900 mb-2">Selamat Datang Kembali</h2>
                <p class="text-sm text-slate-500">Masuk untuk mengelola undangan digital Anda</p>
            </div>

            <form id="form-login" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Email</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-rose-500 text-sm" placeholder="nama@email.com">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-rose-500 text-sm" placeholder="••••••••">
                </div>

                <div id="login-pesan" class="hidden p-3.5 rounded-xl text-sm font-semibold text-center"></div>

                <button type="submit" id="btn-login" class="w-full py-3.5 px-4 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl transition shadow-lg shadow-rose-600/20 flex justify-center items-center">
                    <span>Masuk ke Akun</span>
                </button>
            </form>

            <div class="text-center mt-6 text-sm text-slate-500">
                Belum punya akun? <a href="index.html#register-section" class="text-rose-600 font-semibold hover:underline">Daftar di sini</a>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-500 py-6 text-center text-xs border-t border-slate-800">
        &copy; 2026 Nikahgan.id. All rights reserved.
    </footer>

    <!-- Supabase JS Library -->
    <script src="https://jsdelivr.net"></script>
    <script>
        // Inisialisasi Jembatan Database Supabase
        const supabaseUrl = 'https://supabase.co';
        // Pastikan isi token anon public panjang Anda di bawah ini
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrYXZkb2xrY2FhZ2ltbmlhaWJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1ODM3MDcsImV4cCI6MjEwNjE1OTcwN30.p3t96xEumXdpxJWbi7eAmjFWMhb2_nEYITgvro4YaTI'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const form = document.getElementById('form-login');
        const pesanDiv = document.getElementById('login-pesan');
        const btnLogin = document.getElementById('btn-login');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            btnLogin.disabled = true;
            btnLogin.innerHTML = `<span>Memeriksa...</span>`;
            pesanDiv.classList.add('hidden');

            const email = document.getElementById('login-email').value.toLowerCase().trim();
            const password = document.getElementById('login-password').value;

            try {
                // Melakukan query pencarian user berdasarkan email dan password_hash di Supabase
                const { data, error } = await _supabase
                    .from('users')
                    .select('id, email, nama_lengkap, role')
                    .eq('email', email)
                    .eq('password_hash', password); // Pencocokan password string dasar untuk tahap awal development

                if (error) throw error;

                if (data.length === 0) {
                    pesanDiv.className = "p-3.5 rounded-xl text-sm font-semibold text-center bg-rose-50 text-rose-800";
                    pesanDiv.innerText = "Email atau Password salah!";
                    pesanDiv.classList.remove('hidden');
                } else {
                    pesanDiv.className = "p-3.5 rounded-xl text-sm font-semibold text-center bg-emerald-50 text-emerald-800";
                    pesanDiv.innerText = "Login sukses! Mengalihkan ke dasbor...";
                    pesanDiv.classList.remove('hidden');
                    
                    // Simpan sesi user singkat ke browser (LocalStorage)
                    localStorage.setItem('user_session', JSON.stringify(data[0]));
                    
                    // Alihkan pengguna ke halaman dashboard.html setelah 1.5 detik
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                }

            } catch (error) {
                console.error(error);
                pesanDiv.className = "p-3.5 rounded-xl text-sm font-semibold text-center bg-rose-50 text-rose-800";
                pesanDiv.innerText = "Terjadi kendala koneksi server: " + error.message;
                pesanDiv.classList.remove('hidden');
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerHTML = `<span>Masuk ke Akun</span>`;
            }
        });
    </script>
</body>
</html>
